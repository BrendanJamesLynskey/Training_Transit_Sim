name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (disagg-sim from git, pinned at 69ffd2b)
        run: pip install -e ".[dev]"
      - name: Lint (ruff E, F, W)
        run: ruff check --select E,F,W .
      - name: Tests (formulas, invariants, analytic check, bisection, pinned inputs)
        run: pytest -rs
      - name: results.md and results.json regenerate unchanged (header line aside)
        run: |
          python examples/results.py > /dev/null
          git diff --exit-code -I '^Generated by' examples/results.md examples/results.json
      - name: Bandwidth sweep smoke test
        run: python scripts/sweep_bandwidth.py --gbps 10 100 > /dev/null
